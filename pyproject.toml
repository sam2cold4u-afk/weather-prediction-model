[project]
name = "project1"
version = "0.1.0"
description = "Next-day weather prediction with chronological backtesting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["matplotlib", "numpy", "pandas", "scikit-learn"]

[project.scripts]
project1 = "project1:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
